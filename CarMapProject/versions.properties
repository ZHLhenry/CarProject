# ============================================================================
# com.sky.automap:* 各 artifact 的版本 —— 全仓库唯一版本来源
#
# 为什么按 artifact 分开记：允许**单模块升版**。例如只把 map-sdk-amap-850 升到
# 1.0.1，其余 11 个仍停在 1.0.0，不必为了一个 SDK 包把全部 AAR 重新刷一遍。
#
# 谁在读这个表：
#   · 各工程的 publish：artifactId = 模块名，version = 本表对应那行
#   · 各工程的依赖声明：com.sky.automap:<artifact>:<本表版本>
#   · 壳工程 app：按渠道算出的 map-impl-<厂商> / map-sdk-<厂商>-<版本> 也按本表取版本
#
# 怎么改：
#   ./versions.py bump map-sdk-amap-850 1.0.1     # 只升一个
#   ./versions.py bump --all 1.1.0                # 全部升
#   直接编辑本文件也行，但改完必须重新 publish 对应工程，仓库里才会有新 AAR。
#
# 注意：这里只管 AAR 版本（Maven 坐标），与 APK 的 versionName / versionCode 无关，
#       后者只在 CarMapProject/build.gradle.kts 的 skyBuild.* 里声明。
# ============================================================================

infrastructure=1.0.0
map-api=1.0.0
map-impl-amap=1.0.0
map-impl-baidu=1.0.0
map-sdk-amap-850=1.0.0
map-sdk-amap-910=1.0.0
map-sdk-baidu-v21=1.0.0
map-sdk-baidu-v22=1.0.0
